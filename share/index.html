<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>TitanLog Programı</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #f5f5f5;
        font:
          16px system-ui,
          sans-serif;
        display: grid;
        min-height: 100vh;
        place-items: center;
      }
      main {
        max-width: 34rem;
        padding: 2rem;
      }
      a {
        display: inline-block;
        background: #b87333;
        color: #111;
        font-weight: 700;
        padding: 0.9rem 1.2rem;
        border-radius: 0.6rem;
        text-decoration: none;
      }
      .muted {
        color: #bbb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TitanLog Programı</h1>
      <p>
        Bu bağlantı TitanLog ile paylaşılmış bir antrenman programı içeriyor.
      </p>
      <p><a id="open" href="#">TitanLog'da Aç</a></p>
      <p id="status" class="muted">
        Bağlantı yalnız bu tarayıcıda doğrulanıyor.
      </p>
      <p class="muted">
        TitanLog yüklü değilse uygulamayı resmi mağaza sayfasından edindikten
        sonra bu bağlantıyı yeniden açın.
      </p>
    </main>
    <script>
      const a = document.getElementById('open'),
        s = document.getElementById('status');

      function validateFragment() {
        const h = location.hash.slice(1),
          ok = h.length <= 2200 && /^TL1_[A-Za-z0-9_-]{40,2200}$/.test(h);

        if (ok) {
          a.href = 'titanlog:///share#' + h;
          s.textContent =
            'Şablon sunucuya gönderilmez; yalnızca açık düğmesine bastığınızda TitanLog’a aktarılır.';
        } else {
          a.removeAttribute('href');
          s.textContent = 'Bu bağlantı geçersiz veya eksik.';
        }
      }

      validateFragment();
      addEventListener('hashchange', validateFragment);
    </script>
  </body>
</html>
